# loop.yaml: routes.yaml with r3's /20 pointed back at r1 (Step 8's loop). NN = 16, NNNN = 5016 (see "Your addresses").
#
#   python3 routers.py --id 5016 --routes routes.yaml
#
# checks every route first, then switches forwarding on and applies them. IPv4 only.

r1:
  - to: 10.16.32.0/24
    via: 10.16.12.2
  - to: 10.16.32.0/20
    via: 10.16.13.2

r3:
  - to: 10.16.32.0/20
    via: 10.16.13.1
  - to: 10.16.1.0/24
    via: 10.16.13.1

r2:
  - to: 10.16.1.0/24
    via: 10.16.12.1
