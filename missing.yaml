# missing.yaml: a broken copy of network.yaml, to prove check_paths() catches a gap.
# The only change: r2's route to admin (10.16.1.0/24) is deleted, so h2 -> h1 and
# h3 -> h1 reach r2 and have nowhere to go.
#
#   python3 build_routed.py missing.yaml >> evidence3/check.txt 2>&1

student_id_last4: "5016"

routers: [r1, r2, r3, r4]

lans:
  - name: admin
    network: 10.16.1.0/24
    router: r1
    host: h1
  - name: library
    network: 10.16.2.0/24
    router: r2
    host: h2
  - name: lab-a
    network: 10.16.48.0/24
    router: r3
    host: h3
  - name: lab-b
    network: 10.16.52.0/24
    router: r4
    host: h4

links:
  - [r1, r2, 10.16.100.0/30]   # r1 .1, r2 .2
  - [r2, r3, 10.16.100.4/30]   # r2 .5, r3 .6
  - [r3, r4, 10.16.100.8/30]   # r3 .9, r4 .10
  - [r4, r1, 10.16.100.12/30]  # r4 .13, r1 .14

routes:
  r1:
    - to: 10.16.2.0/24         # library, next door
      via: 10.16.100.2         # r2
    - to: 10.16.48.0/20        # summary: lab-a and lab-b
      via: 10.16.100.13        # r4
  r2:
    - to: 10.16.48.0/20        # summary: lab-a and lab-b
      via: 10.16.100.6         # r3
  r3:
    - to: 10.16.52.0/24        # lab-b, next door
      via: 10.16.100.10        # r4
    - to: 10.16.0.0/22         # summary: admin and library
      via: 10.16.100.5         # r2
  r4:
    - to: 10.16.48.0/24        # lab-a, next door
      via: 10.16.100.9         # r3
    - to: 10.16.0.0/22         # summary: admin and library
      via: 10.16.100.14        # r1
